# JamClock skin: warm graphite over the piano photo (vst/assets/piano.jpg), green clock accent.
# Appearance and copy only - widget coordinates must not move (the MPC overlays live controls).
# Q-Link-watched controls stay left of x ~1025 (the sidebar slides over the rest).
theme_bg=0c0a08
theme_panel=17120e
theme_line=2b251f
theme_ink=ece4d4
theme_ink_dim=a89a86
theme_ink_faint=5f564a
theme_accent=4ade80
theme_accent_hi=c8f7d4
theme_knob_face=161210
theme_knob_ring=3a3129
theme_bar=2b251f
theme_seg_active=4ade80
theme_seg_inactive=171310
theme_seg_active_tx=0c0a08
theme_btn_text=ece4d4
theme_well=070605
theme_knob_off=5f564a
theme_knob_dot=4ade80
theme_tab_on=171310
theme_lcd=070605
theme_box=17120e
theme_btn_bg=1d1815
theme_chrome_ink=ece4d4
theme_go_on=4ade80
theme_go_off=5f564a
theme_tabs=2b251f
art_css=skin.css

[tab JAMCLOCK]
frame x=40 y=100 w=1200 h=550 title="JamClock"
text cx=170 cy=170 label="Clock out" size=3 color=a89a86
enum_h cx=170 cy=245 label="" key=enable sw=208 sh=66 rows=2
text cx=520 cy=170 label="Bias" size=3 color=a89a86
enum_h cx=520 cy=245 label="" key=bias sw=220 sh=66 rows=3
knob cx=170 cy=520 r=44 label="Min BPM" key=minbpm
knob cx=360 cy=520 r=44 label="Max BPM" key=maxbpm
knob cx=550 cy=520 r=44 label="Silence s" key=silence
button cx=170 cy=400 label="Reset" key=reset w=184 h=78
readout cx=990 cy=220 w=300 h=90 label="BPM" key=bpm tsize=56 talign=center
readout cx=990 cy=330 w=300 h=44 label="Status" key=status tsize=28 talign=center
readout cx=990 cy=394 w=300 h=30 label="" key=port tsize=16 tcolor=4ade80 talign=center
text cx=52 cy=640 label="Image made by Ben Currington - CC BY-SA 2.0" size=2.4 color=5f564a align=left
text cx=1228 cy=640 label="VST made by github.com/miathedev" size=2.4 color=5f564a align=right
qlinks "JAMCLOCK" = enable,bias,minbpm,maxbpm,silence,reset
